name: Playwright Regression Suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      grep:
        description: 'Optional Playwright --grep pattern (e.g. @smoke, @regression)'
        required: false
        default: ''

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BASE_URL: ${{ secrets.BASE_URL }}
      SUPER_ADMIN_EMAIL: ${{ secrets.SUPER_ADMIN_EMAIL }}
      SECRETARY_EMAIL: ${{ secrets.SECRETARY_EMAIL }}
      JOINT_SECRETARY_MULTI_DIVISION_EMAIL: ${{ secrets.JOINT_SECRETARY_MULTI_DIVISION_EMAIL }}
      DIVISION_USER_EMAIL: ${{ secrets.DIVISION_USER_EMAIL }}
      PARLIAMENT_USER_EMAIL: ${{ secrets.PARLIAMENT_USER_EMAIL }}
      CI: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        # Runs the full suite by default; a manual "Run workflow" dispatch can
        # scope it down (e.g. to just @smoke) via the grep input. Concurrency
        # is fixed at 2 workers in playwright.config.ts - the shared demo
        # environment rate-limits aggressive request bursts (see README).
        run: npx playwright test ${{ github.event.inputs.grep && format('--grep {0}', github.event.inputs.grep) || '' }}

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload JUnit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-results
          path: test-results/junit.xml
          retention-days: 14

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 14
